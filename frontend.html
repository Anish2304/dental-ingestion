<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DocuDent.AI – Patients</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --sb:#0f1e3a;--sb-h:#1a2f52;--sb-a:#1e3560;
      --accent:#2563eb;--accent-l:#3b82f6;--accent-g:#eff6ff;
      --danger:#ef4444;--success:#10b981;
      --tp:#111827;--ts:#6b7280;--tm:#9ca3af;
      --bd:#e5e7eb;--bg:#f8fafc;--card:#fff;
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tp);display:flex;height:100vh;overflow:hidden}

    /* sidebar */
    .sidebar{width:220px;min-width:220px;background:var(--sb);display:flex;flex-direction:column}
    .logo{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
    .logo span{font-size:17px;font-weight:700;color:#fff}
    .logo span em{color:var(--accent-l);font-style:normal}
    .nav{flex:1;padding:12px 10px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,.55);font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
    .nav-item:hover{background:var(--sb-h);color:rgba(255,255,255,.85)}
    .nav-item.active{background:var(--sb-a);color:#fff}
    .nav-item svg{width:16px;height:16px;flex-shrink:0}

    /* main */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .topbar{height:54px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:flex-end;padding:0 28px}
    .account{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ts)}
    .av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

    .content{flex:1;overflow-y:auto;padding:26px 30px}
    .page-title{font-size:21px;font-weight:700;margin-bottom:16px}

    /* toolbar */
    .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .search-wrap{display:flex;flex:0 0 300px}
    .search-input{flex:1;height:36px;border:1px solid var(--bd);border-right:none;border-radius:6px 0 0 6px;padding:0 12px;font-family:inherit;font-size:13px;outline:none}
    .search-input:focus{border-color:var(--accent)}
    .btn-search{height:36px;width:36px;background:var(--accent);border:none;border-radius:0 6px 6px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
    .btn-add{margin-left:auto;height:36px;padding:0 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
    .btn-add:hover,.btn-search:hover{background:#1d4ed8}
    .count-label{font-size:13px;color:var(--ts);margin-bottom:10px}
    .count-label strong{color:var(--tp)}

    /* table */
    .table-wrap{background:var(--card);border-radius:10px;border:1px solid var(--bd);overflow:hidden}
    table{width:100%;border-collapse:collapse}
    thead tr{background:#f1f5f9}
    th{padding:10px 14px;text-align:left;font-size:12px;font-weight:600;color:var(--ts);border-bottom:1px solid var(--bd)}
    tbody tr{border-bottom:1px solid var(--bd);transition:.12s}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:#f8fafc}
    td{padding:12px 14px;font-size:13px;vertical-align:middle}

    .p-cell{display:flex;align-items:center;gap:10px}
    .p-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
    .p-name{font-weight:600;font-size:13.5px}
    .p-sub{font-size:11px;color:var(--tm);margin-top:1px}

    .action-btn{width:28px;height:28px;border-radius:6px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tm)}
    .action-btn:hover{background:var(--accent-g);color:var(--accent)}

    /* states */
    .state{text-align:center;padding:48px;color:var(--tm)}
    .spinner{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* pagination */
    .pagination{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:12px 14px;border-top:1px solid var(--bd)}
    .pg-btn{width:28px;height:28px;border-radius:50%;border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--ts)}
    .pg-btn.active{background:var(--accent);color:#fff;font-weight:700}
    .pg-btn:hover:not(.active){background:var(--bd)}

    /* modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:.2s}
    .overlay.open{opacity:1;pointer-events:all}
    .modal{background:#fff;border-radius:12px;width:500px;max-width:94vw;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
    .modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .modal-title{font-size:16px;font-weight:700}
    .modal-x{width:28px;height:28px;border:none;background:var(--bg);border-radius:6px;cursor:pointer;font-size:18px;color:var(--ts)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .fg{display:flex;flex-direction:column;gap:4px}
    .fg.full{grid-column:1/-1}
    label{font-size:11.5px;font-weight:600;color:var(--ts)}
    .fi{height:36px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;font-family:inherit;font-size:13px;outline:none}
    .fi:focus{border-color:var(--accent)}
    .modal-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .btn-cancel{height:36px;padding:0 16px;border:1px solid var(--bd);border-radius:6px;background:#fff;font-family:inherit;font-size:13px;cursor:pointer;color:var(--ts)}
    .btn-save{height:36px;padding:0 20px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .btn-save:hover{background:#1d4ed8}

    /* detail */
    .dr{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
    .dl{width:130px;font-weight:600;color:var(--ts);flex-shrink:0}
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="logo"><span>DOCU<em>DENT</em>.AI</span></div>
  <nav class="nav">
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Control Panel
    </div>
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Patients
    </div>
  </nav>
</aside>

<div class="main">
  <div class="topbar">
    <div class="account">Demo Account <div class="av">DA</div></div>
  </div>
  <div class="content">
    <h1 class="page-title">Patients</h1>
    <div class="toolbar">
      <div class="search-wrap">
        <input class="search-input" id="searchInput" placeholder="Search" oninput="filterTable()"/>
        <button class="btn-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
      <button class="btn-add" onclick="openAdd()">+ Add New Patient</button>
    </div>
    <p class="count-label" id="countLabel"><strong>0</strong> Patients</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Patient</th><th>Provider</th><th>Date of Birth</th><th>SSN (last 4)</th><th>Address</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="6" class="state"><div class="spinner"></div>Loading…</td></tr>
        </tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<!-- Add Modal -->
<div class="overlay" id="addModal">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title">Add New Patient</span>
      <button class="modal-x" onclick="closeAdd()">×</button>
    </div>
    <div class="grid">
      <div class="fg"><label>First Name *</label><input class="fi" id="f_fname" placeholder="John"/></div>
      <div class="fg"><label>Last Name *</label><input class="fi" id="f_lname" placeholder="Doe"/></div>
      <div class="fg"><label>Date of Birth</label><input class="fi" id="f_dob" type="date"/></div>
      <div class="fg"><label>SSN</label><input class="fi" id="f_ssn" placeholder="XXX-XX-XXXX"/></div>
      <div class="fg"><label>Home Phone</label><input class="fi" id="f_phone" placeholder="(555) 000-0000"/></div>
      <div class="fg"><label>Provider</label><input class="fi" id="f_prov" placeholder="DOC1"/></div>
      <div class="fg full"><label>Address</label><input class="fi" id="f_address" placeholder="123 Main St"/></div>
      <div class="fg"><label>City</label><input class="fi" id="f_city" placeholder="Springfield"/></div>
      <div class="fg"><label>State</label><input class="fi" id="f_state" placeholder="CT"/></div>
      <div class="fg"><label>ZIP</label><input class="fi" id="f_zip" placeholder="12345"/></div>
      <div class="fg"><label>Email</label><input class="fi" id="f_email" type="email" placeholder="john@example.com"/></div>
    </div>
    <div class="modal-ft">
      <button class="btn-cancel" onclick="closeAdd()">Cancel</button>
      <button class="btn-save" onclick="savePatient()">Save Patient</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="detailModal">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title" id="detailName"></span>
      <button class="modal-x" onclick="closeDetail()">×</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<script>
  const API = 'http://localhost:5000/api/patients';
  const COLORS = ['#6366f1','#0ea5e9','#10b981','#f59e0b','#ec4899','#8b5cf6','#14b8a6'];
  const PAGE_SIZE = 10;
  let all = [], filtered = [], page = 1;

  const color = s => { let h=0; for(let c of s) h=(h*31+c.charCodeAt(0))&0xffffffff; return COLORS[Math.abs(h)%COLORS.length]; };
  const ini   = p => ((p.FName||'').charAt(0)+(p.LName||'').charAt(0)).toUpperCase()||'?';
  const fmtD  = d => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return m?`${m}/${dd}/${y}`:d; };

  async function load() {
    try {
      const r = await fetch(API);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      all = await r.json();
      filtered = [...all];
      render();
    } catch(e) {
      document.getElementById('tbody').innerHTML = `<tr><td colspan="6" class="state" style="color:#ef4444">⚠ ${e.message}</td></tr>`;
    }
  }

  function render() {
    const tbody = document.getElementById('tbody');
    document.getElementById('countLabel').innerHTML = `<strong>${filtered.length}</strong> Patient${filtered.length!==1?'s':''}`;
    if (!filtered.length) { tbody.innerHTML='<tr><td colspan="6" class="state">No patients found.</td></tr>'; document.getElementById('pagination').innerHTML=''; return; }

    const rows = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
    tbody.innerHTML = rows.map(p => {
      const name = `${p.FName||''} ${p.LName||''}`.trim();
      const bg   = color(name);
      const addr = [p.Address,p.City,p.State].filter(Boolean).join(', ')||'—';
      return `<tr>
        <td><div class="p-cell">
          <div class="p-av" style="background:${bg}">${ini(p)}</div>
          <div><div class="p-name">${name}</div>${p.HmPhone?`<div class="p-sub">${p.HmPhone}</div>`:''}</div>
        </div></td>
        <td>${p.priProvAbbr||'—'}</td>
        <td style="font-family:'DM Mono',monospace">${fmtD(p.Birthdate)}</td>
        <td style="font-family:'DM Mono',monospace">${p.SSN?p.SSN.slice(-4):'—'}</td>
        <td style="max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${addr}">${addr}</td>
        <td><button class="action-btn" title="View" onclick='openDetail(${JSON.stringify(JSON.stringify(p))})'>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button></td>
      </tr>`;
    }).join('');

    const total = Math.ceil(filtered.length/PAGE_SIZE);
    if (total<=1) { document.getElementById('pagination').innerHTML=''; return; }
    let pg = `<button class="pg-btn" onclick="changePage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
    for(let i=1;i<=total;i++) pg+=`<button class="pg-btn ${i===page?'active':''}" onclick="changePage(${i})">${i}</button>`;
    pg+=`<button class="pg-btn" onclick="changePage(${page+1})" ${page===total?'disabled':''}>›</button>`;
    document.getElementById('pagination').innerHTML=pg;
  }

  function changePage(p) { const t=Math.ceil(filtered.length/PAGE_SIZE); if(p<1||p>t)return; page=p; render(); }

  function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    filtered = all.filter(p => `${p.FName||''} ${p.LName||''}`.toLowerCase().includes(q)||(p.Email||'').toLowerCase().includes(q)||(p.Address||'').toLowerCase().includes(q));
    page=1; render();
  }

  // Add
  function openAdd()  { document.getElementById('addModal').classList.add('open'); }
  function closeAdd() { document.getElementById('addModal').classList.remove('open'); }

  async function savePatient() {
    const g = id => document.getElementById(id).value.trim();
    if (!g('f_fname')||!g('f_lname')) { alert('First and Last name are required.'); return; }
    const body = { FName:g('f_fname'), LName:g('f_lname'), Birthdate:g('f_dob'), SSN:g('f_ssn'), HmPhone:g('f_phone'), priProvAbbr:g('f_prov'), Address:g('f_address'), City:g('f_city'), State:g('f_state'), Zip:g('f_zip'), Email:g('f_email'), PatStatus:'Patient', BillingType:'Standard Account' };
    try {
      const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const p = await r.json();
      all.unshift(p); filtered=[...all]; page=1; render(); closeAdd();
      ['f_fname','f_lname','f_dob','f_ssn','f_phone','f_prov','f_address','f_city','f_state','f_zip','f_email'].forEach(id=>document.getElementById(id).value='');
    } catch(e) { alert('Save failed: '+e.message); }
  }

  // Detail
  function openDetail(jsonStr) {
    const p = JSON.parse(jsonStr);
    const name = `${p.FName||''} ${p.LName||''}`.trim();
    document.getElementById('detailName').textContent = name;
    const fields = [['Patient #',p.PatNum],['Status',p.PatStatus],['DOB',fmtD(p.Birthdate)],['SSN',p.SSN||'—'],['Address',[p.Address,p.City,p.State,p.Zip].filter(Boolean).join(', ')||'—'],['Phone',p.HmPhone||'—'],['Email',p.Email||'—'],['Provider',p.priProvAbbr||'—'],['Billing',p.BillingType||'—']];
    document.getElementById('detailContent').innerHTML = fields.map(([l,v])=>`<div class="dr"><span class="dl">${l}</span><span>${v}</span></div>`).join('');
    document.getElementById('detailModal').classList.add('open');
  }
  function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

  document.getElementById('addModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeAdd(); });
  document.getElementById('detailModal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeDetail(); });

  load();
</script>
</body>
</html>
